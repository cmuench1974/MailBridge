name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Core
        run: dotnet restore src/MailBridge.Core/MailBridge.Core.csproj

      - name: Restore Tests
        run: dotnet restore tests/MailBridge.Core.Tests/MailBridge.Core.Tests.csproj

      - name: Build Core
        run: dotnet build src/MailBridge.Core/MailBridge.Core.csproj -c Release --no-restore

      - name: Build Tests
        run: dotnet build tests/MailBridge.Core.Tests/MailBridge.Core.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/MailBridge.Core.Tests/MailBridge.Core.Tests.csproj -c Release --no-build
